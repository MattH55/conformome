name: Deploy

# Builds the site from scratch (download -> validate) and publishes site/dist with GitHub Pages.
# Runs on pushes to the repository's default branch, and on demand.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # queue, so a long build is not cancelled before it saves its cache

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # First, so that a missing Pages setup fails in seconds rather than after the download.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test]"
      # Raw downloads are cached for the ISO week: pushes within a week reuse them, each week refetches.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ steps.week.outputs.week }}-${{ hashFiles('targets.yaml', 'curation/*.yaml') }}
          restore-keys: raw-${{ steps.week.outputs.week }}-
      - name: Download raw inputs
        run: make download
      - name: Validate before deploying
        run: make validate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
