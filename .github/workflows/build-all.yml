name: Build all

# Full rebuild of every molecule in targets.yaml (download -> ingest -> map -> models -> site -> validate),
# without publishing. Use it to populate the data for a branch and inspect it before merging:
# the built site and a per-molecule summary are uploaded as workflow artifacts.
# Runs on pushes to claude/** branches and on demand. Deploying to conformome.org stays with deploy.yml.
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: write  # to push build reports to reports/<branch> (logs and artifacts are not readable from every client)

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test,conformations]"
      # Same weekly cache as deploy.yml; caches saved on a branch are visible only to that branch.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # Restore and save are separate so that the download is saved even when a later step fails or the
      # download step times out (the combined actions/cache post-step is skipped on cancellation).
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ steps.week.outputs.week }}-${{ hashFiles('targets.yaml', 'curation/*.yaml') }}
          restore-keys: raw-${{ steps.week.outputs.week }}-
      - name: Download raw inputs
        timeout-minutes: 240
        run: |
          set -o pipefail
          make download 2>&1 | tee download.log
      - name: Save raw-data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ steps.week.outputs.week }}-${{ hashFiles('targets.yaml', 'curation/*.yaml') }}-${{ github.run_id }}
      - name: Report download failure
        if: failure()
        run: |
          msg=$(tail -n 40 download.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=make download failed::${msg}"
      - name: Build
        if: always()
        run: |
          set -o pipefail
          make site 2>&1 | tee build.log
      - name: Validate (schemas, references, licences, links)
        if: always()
        run: |
          set -o pipefail
          python -m conformome validate 2>&1 | tee validate.log
      # Tests run separately so that a test failure unrelated to the data (e.g. the audit tests, which use a
      # Windows temp path) does not stop the validator.
      - name: Tests
        if: always()
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee tests.log
      - name: Summary
        if: always()
        run: python -m conformome.summary >> "$GITHUB_STEP_SUMMARY"
      - name: Per-molecule summary file
        if: always()
        run: |
          python -m conformome.summary > build-summary.md
          python -m conformome.conformations.report > conformations-summary.md || true
      # site/dist holds only what may be redistributed (validate checks the downloads); build/ is not uploaded
      # because it carries records from sources whose licence forbids redistribution.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformome-site
          path: |
            site/dist
            build-summary.md
            data/MANIFEST.json
            data/raw/download_failures.json
          if-no-files-found: warn
          retention-days: 14
      - name: Push build reports to reports/<branch>
        if: always()
        run: |
          set -e
          mkdir -p /tmp/report
          cp -f build-summary.md conformations-summary.md download.log build.log validate.log tests.log /tmp/report/ 2>/dev/null || true
          cp -f data/raw/download_failures.json data/MANIFEST.json /tmp/report/ 2>/dev/null || true
          tail -n 300 download.log > /tmp/report/download.tail.log 2>/dev/null || true
          cd /tmp/report
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build report for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/reports/${GITHUB_REF_NAME}
