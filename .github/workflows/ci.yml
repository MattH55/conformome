name: CI

# Pull requests run the test suite. A full download runs weekly and on demand.
# Pushes to the default branch are validated by deploy.yml.
on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test]"
      - name: Tests and the fixture build
        run: python -m pytest -q

  validate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test]"
      # Raw downloads are cached for the ISO week: pushes within a week reuse them, each week refetches.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ steps.week.outputs.week }}-${{ hashFiles('targets.yaml', 'curation/*.yaml') }}
          restore-keys: raw-${{ steps.week.outputs.week }}-
      - name: Download raw inputs
        run: make download
      - name: Validate (ingest, map, models, site, schema, links, tests)
        run: make validate
