name: CI

# Full validation on pull requests (the deploy workflow validates pushes to the default branch).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test]"
      # Raw downloads are cached for the ISO week: pushes within a week reuse them, each week refetches.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ steps.week.outputs.week }}-${{ hashFiles('targets.yaml', 'curation/*.yaml') }}
          restore-keys: raw-${{ steps.week.outputs.week }}-
      - name: Download raw inputs
        run: make download
      - name: Validate (ingest, map, models, site, schema, links, tests)
        run: make validate
