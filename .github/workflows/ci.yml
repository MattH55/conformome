name: CI

# Full validation on pull requests (the deploy workflow validates pushes to the default branch).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test]"
      - name: Download raw inputs
        run: make download
      - name: Validate (ingest, map, models, site, schema, links, tests)
        run: make validate
