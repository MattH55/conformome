[project]
name = "conformome"
version = "0.1.0"
description = "Per-protein index of conformational states and the techniques that probed them"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    "referencing>=0.30",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conformome*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
