# Molecules Conformome builds. A molecule listed here gets a page from its evidence alone;
# states and mappings come from curation/<molecule ID>.yaml when a curator writes one.
# Proteins are named by uniprot; RNA and DNA by molecule_id (RNAcentral URS..._<taxid>, or DNA-<hash>
# with the anchor_pdb entry whose DNA chain defines the sequence).
# Batches record why each protein was added.
#   pilot-1: the brief's ten pilot proteins
#   pilot-2: twenty well-studied conformational systems, chosen by hand
#   nucleic-acid-1: first nucleic-acid pilot molecules, to test the RNAcentral, Rfam and NAKB sources
#   multi-source-1: at least one PDB structure, one BMRB deposit and one SMASH-BIO record, with 8 or more
#                   BMRB deposits or SMASH-BIO records (selected 2026-10-19 from the BMRB UniProt mapping
#                   and the SMASH-BIO release)
