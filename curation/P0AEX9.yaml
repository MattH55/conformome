# Maltose/maltodextrin-binding periplasmic protein, Escherichia coli (strain K12). Draft: curator to review.
uniprot: P0AEX9
name: Maltose-binding periplasmic protein (MBP)
curator: draft (unreviewed)
status: draft
as_of: 2026-10-19
states:
  - id: MBP-open-apo
    name: open, ligand-free
    basis: observed
    representative_pdb: "1JW4"
    description: Ligand-free open form, as in 1JW4.
  - id: MBP-closed-maltose
    name: closed, maltose-bound
    basis: observed
    representative_pdb: "1ANF"
    description: Closed form with maltose bound, as in 1ANF.
assignments:
  - evidence_id: EV-PDB-1JW4-1
    state: MBP-open-apo
    confidence: high
    justification: "Ligand-free open structure; representative for the open apo state."
  - evidence_id: EV-PDB-1ANF-1
    state: MBP-closed-maltose
    confidence: high
    justification: "Maltose-bound closed structure; representative for the closed state."
rules:
  - id: mbp-maltodextrin-closed
    state: MBP-closed-maltose
    confidence: medium
    justification: "Linear alpha-1,4 maltodextrin bound (branched entity); maltose and maltodextrins close MBP."
    match: {ligand_text_any: ["glucopyranose-(1-4)"], ligand_text_none: ["cyclo"]}
  - id: mbp-maltose-ligand-closed
    state: MBP-closed-maltose
    confidence: medium
    justification: "Maltose (MAL) or maltotriose (MLR) bound as a nonpolymer ligand."
    match: {ligands_any: [MAL, MLR]}
  - id: mbp-cyclodextrin-open
    state: MBP-open-apo
    confidence: medium
    justification: "Beta-cyclodextrin binds without closing MBP (as in 1DMB)."
    match: {ligand_text_any: ["cyclo"]}
  - id: mbp-sugar-free-open
    state: MBP-open-apo
    confidence: low
    justification: "Structure with no maltodextrin bound; MBP is open without sugar. Many entries are MBP fusions, so low."
    match: {techniques: [xray, cryoem], ligands_none: [MAL, MLR], ligand_text_none: ["glucopyranose", "cyclo"]}
transitions: []
