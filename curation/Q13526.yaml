# Pin1, Homo sapiens. Draft: curator to review.
uniprot: Q13526
name: Pin1
curator: draft (unreviewed)
status: draft
as_of: 2026-10-19
states:
  - id: Pin1-native
    name: native fold
    basis: observed
    representative_pdb: "1PIN"
    description: WW and PPIase domains of Pin1, as in 1PIN. Inter-domain arrangements are not separated.
  - id: Pin1-unfolded
    name: unfolded
    basis: inferred
    representative_pdb: null
    description: Unfolded ensemble reached by denaturant, temperature or force. No observed structure.
    assumptions:
      - Treated as a single ensemble; residual structure and intermediates are not resolved.
      - Defined by indirect measurements (denaturation, NMR of denatured samples, force spectroscopy); no model is exported.
assignments:
  - pdb: "1PIN"
    state: Pin1-native
    confidence: high
    justification: "Representative native structure; title and UniProt mapping checked against RCSB."
rules:
  - id: pin1-structures-native
    state: Pin1-native
    confidence: medium
    justification: "Experimental structure of this small single-domain protein; deposited structures show the native fold unless the title says otherwise."
    match:
      techniques: [xray, cryoem, nmr_structure, neutron, microed]
      title_none: ["fibril", "amyloid", "unfolded", "denatured", "molten", "swapped"]
  - id: pin1-nmr-shifts-native
    state: Pin1-native
    confidence: low
    justification: "Chemical shift assignment of the folded protein; shift-only entries rarely describe non-native states unless titled so."
    match:
      techniques: [nmr_shifts, nmr_dynamics]
      title_none: ["unfolded", "denatured", "urea", "molten", "fibril", "amyloid"]
  - id: pin1-saxs-native
    state: Pin1-native
    confidence: low
    justification: "SAXS of the protein alone in solution under native conditions; samples with partners and denatured samples are excluded."
    match:
      techniques: [saxs_sans]
      title_none: ["unfolded", "denatured", "urea", "complex"]
      ligand_text_none: ["partner:"]
  - id: pin1-md-native
    state: Pin1-native
    confidence: low
    justification: "Simulation started from a native structure (prediction)."
    match:
      techniques: [md]
  - id: pin1-af-native
    state: Pin1-native
    confidence: low
    justification: "AlphaFold prediction of the native fold (prediction, not a measurement)."
    match:
      techniques: [af_prediction]
  - id: pin1-denatured-nmr
    state: Pin1-unfolded
    confidence: medium
    justification: "NMR data titled as unfolded or denatured describe the unfolded ensemble."
    match:
      techniques: [nmr_shifts, nmr_dynamics]
      title_any: ["unfolded", "denatured", "urea"]
  - id: pin1-force-unfolding
    state: Pin1-unfolded
    confidence: low
    justification: "SMASH-BIO force record classed as protein unfolding; mapped to the unfolded state the molecule reaches. Most SMASH-BIO values are extracted automatically."
    match:
      sources: [SMASH-BIO]
      title_any: ["experiment class: unfolding_protein", "unfolding_protein"]
transitions: []
