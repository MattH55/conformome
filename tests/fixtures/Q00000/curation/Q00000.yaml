    confidence: high
    justification: "Synthetic apo open structure; representative of FX-open."
  - evidence_id: EV-PDB-9FX2-1
    state: FX-closed
    confidence: medium
    justification: "Synthetic cryo-EM closed structure; complex-dependent so medium."
  - evidence_id: EV-PDB-9FX3-1
    state: FX-intermediate
    confidence: low
