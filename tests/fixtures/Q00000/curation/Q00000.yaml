# SYNTHETIC fixture protein for tests. Not a real protein; values are invented to exercise the pipeline.
uniprot: Q00000
name: Fixture kinase (synthetic)
curator: fixture-author
status: draft
as_of: 2026-01-15
states:
  - id: FX-open
    name: open apo
    basis: observed
    representative_pdb: "9FX1"
    description: Synthetic open apo state, represented by synthetic entry 9FX1.
  - id: FX-closed
    name: closed with substrate
    basis: observed
    parent: null
    representative_pdb: "9FX2"
    description: Synthetic closed state, represented by synthetic entry 9FX2.
  - id: FX-intermediate
    name: intermediate I1
    basis: inferred
    representative_pdb: null
